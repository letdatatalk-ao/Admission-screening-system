version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pgars-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pg_screening}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pgars-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: pgars-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pgars-backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pgars-celery
    command: celery -A backend.app.tasks worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - ./storage:/app/storage
      - ./data:/app/data  

    environment:
      - PYTHONPATH=/app

    restart: unless-stopped
    
  streamlit:
    build: ./streamlit_app
    container_name: pgars-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    volumes:
      - ./streamlit_app:/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_models: